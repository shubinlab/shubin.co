name: Live website browser audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          which google-chrome-stable || which google-chrome || which chromium || which chromium-browser
      - name: Audit published site with real Chromium
        run: node scripts/test-live-site.mjs
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shubin-site-audit
          path: site-audit/
          if-no-files-found: ignore

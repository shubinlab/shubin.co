name: Live website browser audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          which google-chrome-stable || which google-chrome || which chromium || which chromium-browser
      - name: Wait for published site files to update
        run: |
          for i in $(seq 1 48); do
            home=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/?qa=$GITHUB_SHA" || true)
            ruhome=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/ru/?qa=$GITHUB_SHA" || true)
            bio=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/about/?qa=$GITHUB_SHA" || true)
            rubio=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/ru/about/?qa=$GITHUB_SHA" || true)
            casepage=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/simula/?qa=$GITHUB_SHA" || true)
            rucase=$(curl -fsSL --connect-timeout 6 --max-time 12 "https://shubin.co/ru/simula/?qa=$GITHUB_SHA" || true)
            if echo "$home" | grep -q 'href="/about/"' &&
               echo "$ruhome" | grep -q 'href="/ru/about/"' &&
               echo "$bio" | grep -q 'class="profile-card work-card bio-card"' &&
               echo "$rubio" | grep -q 'class="bio-card"' &&
               echo "$casepage" | grep -q 'Interactive AI simulator for managing the information space' &&
               echo "$rucase" | grep -q 'Интерактивный ИИ-тренажер управления информационным полем'; then
              echo "New HTML version is published"
              exit 0
            fi
            sleep 5
          done
          echo "Published version did not appear" >&2
          exit 1
      - name: Audit published site with real Chromium
        run: node scripts/test-live-site.mjs
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shubin-site-audit
          path: site-audit/
          if-no-files-found: ignore
